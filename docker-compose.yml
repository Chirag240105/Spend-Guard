version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spendguard-postgres
    environment:
      POSTGRES_DB: spendguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spendguard-network

  redis:
    image: redis:7-alpine
    container_name: spendguard-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spendguard-network

volumes:
  postgres_data:
  redis_data:

networks:
  spendguard-network:
    driver: bridge
